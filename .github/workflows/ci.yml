name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: restore, unit tests, full pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries
        # MUST run before setup-renv. That action restores the library itself,
        # so a missing system dependency fails inside the action and the apt
        # step below it never executes. igraph (a targets dependency) needs
        # libglpk; sodium needs libsodium; rmarkdown needs pandoc.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglpk-dev \
            libsodium-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            pandoc

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Verify the lockfile restores cleanly
        run: |
          Rscript -e 'renv::restore(prompt = FALSE)'
          Rscript -e 'cat(R.version.string, "\n")'

      - name: Run unit tests
        run: Rscript -e 'testthat::test_dir("tests", reporter = "summary")'

      - name: Fetch the source dataset
        # R/01_data.R::fetch_data() does this automatically; doing it as an
        # explicit step makes the 45 MB download visible in the log rather
        # than looking like a hang inside tar_make().
        run: |
          mkdir -p data/raw
          curl -sSL --retry 3 -o data/raw/online_retail_II.xlsx \
            "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
          ls -la data/raw/

      - name: Run the full pipeline
        # Fails the build if any target errors. This is what stops a broken
        # analysis from being merged -- the original project reached a
        # presentation with eight empty code cells and no way to tell.
        run: Rscript -e 'targets::tar_make()'

      - name: Confirm outputs were produced
        run: |
          test -f figures/retention-curve.png
          test -f figures/clv-by-segment.png
          test -f reports/tables/diagnostics.md
          ls -1 figures | wc -l

      - name: Assert the headline numbers still hold
        # A cheap guard against a silent regression in the analysis. If the
        # pipeline ever starts producing different results, this fails loudly
        # instead of letting a changed number reach a slide.
        run: |
          Rscript -e '
            targets::tar_load(c(results, clv_tbl))
            stopifnot(results$K == 2)
            stopifnot(nrow(clv_tbl) == 4331)
            stopifnot(round(mean(results$survival_check$abs_gap), 2) == 0.31)
            cat("headline checks passed\n")'
